[build]
  command = "pnpm install --frozen-lockfile=false && pnpm data && pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--version"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["data/**"]

[[plugins]]
  package = "@netlify/plugin-nextjs"
